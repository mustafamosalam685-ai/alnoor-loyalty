<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Noor Loyalty - Create Account</title>

  <link rel="stylesheet" href="assets/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">
      <div class="logo-mark">☀️</div>
      <div class="logo-name">AL NOOR</div>
      <div class="logo-sub">LOYALTY</div>
    </div>

    <h1>Create Account</h1>

    <p class="auth-description">
      Create your Al Noor Loyalty account.
    </p>

    <form id="registerForm">

      <label for="fullName">Full Name</label>
      <input
        id="fullName"
        type="text"
        placeholder="Enter your full name"
        autocomplete="name"
        required
      >

      <label for="phone">Mobile Number</label>
      <input
        id="phone"
        type="tel"
        placeholder="05XXXXXXXX"
        autocomplete="tel"
        required
      >

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <button type="submit" id="registerBtn">
        Create Account →
      </button>

    </form>

    <div id="registerMessage"></div>

    <p class="auth-footer">
      Already have an account?
      <a href="customer-login.html">Login</a>
    </p>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://fgarlyoqobopudfkifbp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_pqRr71EgFfQTokW0u6fPgQ_g1pG8vdM";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);


document
  .getElementById("registerForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const name =
      document.getElementById("fullName").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const email =
      document.getElementById("email").value.trim().toLowerCase();

    const message =
      document.getElementById("registerMessage");

    const button =
      document.getElementById("registerBtn");


    if (!name || !phone || !email) {

      message.innerHTML =
        `<div class="error-message">
          Please complete all fields.
        </div>`;

      return;
    }


    button.disabled = true;
    button.textContent = "Sending...";

    message.innerHTML = "";


    try {

      const { data, error } =
        await client.auth.signInWithOtp({

          email: email,

          options: {

            shouldCreateUser: true,

            emailRedirectTo:
              window.location.origin +
              "/alnoor-loyalty/customer-home.html",

            data: {
              full_name: name,
              mobile: phone,
              role: "customer"
            }

          }

        });


      if (error) {
        throw error;
      }


      message.innerHTML = `
        <div class="success-message">
          Account started successfully.<br><br>
          Please check your email and tap the login link.
        </div>
      `;


      button.textContent = "Email Sent ✓";


    } catch (error) {

      console.error("REGISTER ERROR:", error);

      message.innerHTML = `
        <div class="error-message">
          ${error.message || "Something went wrong."}
        </div>
      `;

      button.disabled = false;
      button.textContent = "Create Account →";

    }

  });

</script>

</body>
</html>

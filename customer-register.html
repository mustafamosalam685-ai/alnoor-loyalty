<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Al Noor Loyalty - Create Account</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(rgba(54, 43, 30, 0.08), rgba(54, 43, 30, 0.08)),
        #f7f3eb;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #3f3529;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 35px 28px;
      box-shadow: 0 12px 40px rgba(60, 45, 30, 0.12);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-main {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #6f7d42;
    }

    .logo-sub {
      margin-top: 5px;
      font-size: 12px;
      letter-spacing: 4px;
      color: #8b765d;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
      color: #3f3529;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #8a8177;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #4d4032;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #ddd6cc;
      border-radius: 13px;
      padding: 0 15px;
      font-size: 15px;
      color: #3f3529;
      background: #fff;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #7d8d4b;
      box-shadow: 0 0 0 3px rgba(125, 141, 75, 0.10);
    }

    input::placeholder {
      color: #aaa29a;
    }

    .btn {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 14px;
      background: #748447;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.2s;
    }

    .btn:hover {
      background: #65753b;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #eef6e7;
      color: #536b35;
    }

    .error {
      display: block;
      background: #fff0ee;
      color: #a14336;
    }

    .login-link {
      text-align: center;
      margin-top: 23px;
      font-size: 14px;
      color: #82796f;
    }

    .login-link a {
      color: #6f7d42;
      font-weight: 700;
      text-decoration: none;
    }

    .secure-note {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      line-height: 1.5;
      color: #a19a92;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 11px;
      color: #a69e95;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">
        <div class="logo-main">AL NOOR</div>
        <div class="logo-sub">LOYALTY</div>
      </div>

      <h1>Create Account</h1>

      <p class="subtitle">
        Join Al Noor Loyalty and start collecting points.
      </p>

      <form id="registerForm">

        <div class="form-group">
          <label for="fullName">Full Name</label>

          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
            autocomplete="name"
          />
        </div>


        <div class="form-group">
          <label for="mobile">Mobile Number</label>

          <input
            type="tel"
            id="mobile"
            placeholder="05XXXXXXXX"
            required
            autocomplete="tel"
          />
        </div>


        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            placeholder="example@email.com"
            required
            autocomplete="email"
          />
        </div>


        <button
          type="submit"
          class="btn"
          id="registerButton"
        >
          Create Account
        </button>

      </form>


      <div id="message" class="message"></div>


      <div class="login-link">
        Already have an account?
        <a href="customer-login.html">Login</a>
      </div>


      <div class="secure-note">
        A secure login link will be sent to your email.
        <br />
        No password is required.
      </div>

    </div>


    <div class="footer">
      © Al Noor Modern Bakery
    </div>

  </div>


<script>

  /* =====================================================
     SUPABASE CONFIGURATION
     ===================================================== */

  const SUPABASE_URL =
    "https://fgarlyoqobopudfkifbp.supabase.co";

  /*
    IMPORTANT:
    Put your FULL Supabase Publishable Key here.

    It must start with:

    sb_publishable_

    DO NOT put sb_secret_ here.
  */

  const SUPABASE_KEY =
    "sb_publishable_pqRr71EgFfQTokW0u6fPgQ_g1pG8vdM";


  /* =====================================================
     CREATE SUPABASE CLIENT
     ===================================================== */

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================================
     ELEMENTS
     ===================================================== */

  const form =
    document.getElementById("registerForm");

  const button =
    document.getElementById("registerButton");

  const message =
    document.getElementById("message");


  /* =====================================================
     MESSAGE FUNCTION
     ===================================================== */

  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  /* =====================================================
     REGISTER
     ===================================================== */

  form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const fullName =
      document.getElementById("fullName")
        .value
        .trim();

    const mobile =
      document.getElementById("mobile")
        .value
        .trim();

    const email =
      document.getElementById("email")
        .value
        .trim()
        .toLowerCase();


    /* ---------------------------------------------
       BASIC VALIDATION
       --------------------------------------------- */

    if (!fullName) {

      showMessage(
        "Please enter your full name.",
        "error"
      );

      return;
    }


    if (!mobile) {

      showMessage(
        "Please enter your mobile number.",
        "error"
      );

      return;
    }


    if (!email) {

      showMessage(
        "Please enter your email address.",
        "error"
      );

      return;
    }


    /* ---------------------------------------------
       BUTTON LOADING
       --------------------------------------------- */

    button.disabled = true;

    button.textContent = "Creating Account...";


    showMessage("", "");


    try {

      /* -------------------------------------------
         SUPABASE MAGIC LINK
         ------------------------------------------- */

      const { data, error } =
        await supabaseClient.auth.signInWithOtp({

          email: email,

          options: {

            shouldCreateUser: true,

            emailRedirectTo:
              window.location.origin +
              "/alnoor-loyalty/customer-home.html",

            data: {

              full_name: fullName,

              phone: mobile

            }

          }

        });


      /* -------------------------------------------
         ERROR
         ------------------------------------------- */

      if (error) {

        console.error(
          "Supabase Error:",
          error
        );

        showMessage(
          error.message,
          "error"
        );

        button.disabled = false;

        button.textContent =
          "Create Account";

        return;
      }


      /* -------------------------------------------
         SUCCESS
         ------------------------------------------- */

      showMessage(
        "Account created successfully. " +
        "Please check your email and click the secure login link.",
        "success"
      );


      button.textContent =
        "Check Your Email";


      /* Keep form disabled after success */

    }

    catch (error) {

      console.error(
        "Unexpected Error:",
        error
      );

      showMessage(
        "Something went wrong. Please try again.",
        "error"
      );

      button.disabled = false;

      button.textContent =
        "Create Account";
    }

  });

</script>

</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Members • Al Noor Loyalty</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="topbar"><a class="brand" href="gm-dashboard.html"><span class="sun">☀</span><span>AL NOOR<small>LOYALTY</small></span></a><button class="icon">♧</button></header><main class="container"><h1 class="title">Members</h1><p class="sub">Customer membership overview.</p><div class="card"><input class="input" placeholder="Search by name, ID or phone..." oninput="render(this.value)"><div id="members"></div></div><script>function render(q=""){members.innerHTML=S.members.filter(m=>m.name.toLowerCase().includes(q.toLowerCase())||m.id.includes(q)).map(m=>`<div class="row"><div class="avatar">${m.name.slice(0,2)}</div><div class="grow"><strong>${m.name}</strong><small>ID: ${m.id}</small></div><span class="badge">${money(m.points)} pts</span></div>`).join("")}document.addEventListener("DOMContentLoaded",()=>render())</script></main><div class="nav"><div class="navin"><a class="" href="gm-dashboard.html"><b>▦</b>Dashboard</a><a class="active" href="gm-members.html"><b>♙</b>Members</a><a class="" href="gm-locations.html"><b>⌖</b>Locations</a><a class="" href="gm-reports.html"><b>▥</b>Reports</a><a class="" href="gm-settings.html"><b>⚙</b>Settings</a></div></div><script src="assets/app.js"></script></body></html>

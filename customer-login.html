<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f1e5"><title>Al Noor Loyalty — Sign In</title><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="https://unpkg.com/html5-qrcode"></script></head>
<body class="customer-page" data-page="customer-login"><main class="customer-auth"><section class="customer-auth-card">
<div class="customer-auth-brand"><div class="mark">☀️</div><h1>AL NOOR</h1><small>LOYALTY</small></div>
<h2>Welcome Back</h2><p class="sub">Sign in with your mobile number. No password needed.</p>
<div class="auth-field"><label for="phone">Mobile Number</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="050 123 4567"></div>
<div id="otpBox" class="auth-field hidden"><label for="otp">Verification Code</label><input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"></div>
<button id="sendOtpBtn" class="auth-primary">Send SMS Code&nbsp; →</button>
<button id="verifyOtpBtn" class="auth-primary hidden">Verify &amp; Sign In&nbsp; →</button>
<div id="msg" class="auth-msg"></div>
<a href="customer-register.html"><button class="auth-secondary" type="button">Create Loyalty Account</button></a>
<a class="auth-back" href="index.html">← Back</a>
</section></main><script src="assets/app.js"></script></body></html>
